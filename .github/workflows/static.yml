name: Deploy website to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public website
        run: |
          mkdir public-site
          cp dist/*.* public-site/
          cp dist/v2/app.js dist/v2/public.js dist/v2/defaults.json public-site/
          cp content/copy.json public-site/content.json
          sed \
            -e 's#href="../styles.css"#href="styles.css"#' \
            -e 's#<link rel="stylesheet" href="editor.css">##' \
            -e 's#src="../#src="#g' \
            -e 's#<script type="module" src="editor.js"></script>#<script type="module" src="public.js?v=20261014-2"></script>#' \
            dist/v2/index.html > public-site/index.html
          test ! -e public-site/editor.js
          test ! -e public-site/editor.css
          ! grep -q 'editor.js\|editor.css\|Tekststudio' public-site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
